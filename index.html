<script>
  function gjShowError(msg) {
    var box = document.getElementById("gj-fatal-error");
    var loading = document.getElementById("gj-loading");
    if (loading) loading.style.display = "none";
    if (box) { box.style.display = "block"; box.textContent += msg + "\n"; }
    console.error(msg);
  }
  window.addEventListener("error", function (e) { gjShowError("Error: " + (e.message || e)); });
  window.addEventListener("unhandledrejection", function (e) {
    gjShowError("Error de carga: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // Almacenamiento local del propio navegador: cada dispositivo guarda sus propios datos
  // (tanto los datos de la empresa como la identidad de este dispositivo).
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!prefix || k.startsWith(prefix)) keys.push(k);
      }
      return { keys };
    }
  };
</script>
